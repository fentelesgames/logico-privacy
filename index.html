<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logico Privacy Policy</title>
    <meta name="description" content="Privacy Policy for Logico by Fenteles Games.">
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f151d;
        --panel: #151d27;
        --text: #edf3fb;
        --muted: #9aa8ba;
        --accent: #45df86;
        --border: #283546;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
        color: var(--text);
        background: radial-gradient(circle at top left, rgba(69, 223, 134, 0.14), transparent 34rem), var(--bg);
      }

      main {
        width: min(860px, calc(100% - 32px));
        margin: 0 auto;
        padding: 56px 0;
      }

      .page {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(21, 29, 39, 0.92);
        padding: clamp(24px, 5vw, 48px);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.32);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(32px, 7vw, 56px);
        line-height: 1.05;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 18px;
      }

      .placeholder {
        margin-top: 28px;
        border-left: 4px solid var(--accent);
        padding: 18px 20px;
        border-radius: 6px;
        background: rgba(69, 223, 134, 0.08);
      }

      .placeholder p {
        color: var(--text);
      }

      footer {
        margin-top: 28px;
        color: var(--muted);
        font-size: 14px;
      }

      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="page" aria-labelledby="title">
        <p class="eyebrow">Fenteles Games</p>
        <h1 id="title">Logico Privacy Policy</h1>
        <p>This page is reserved for the official privacy policy for Logico.</p>
        <div class="placeholder">
          <p>The final privacy policy text will be added here before publication.</p>
        </div>
        <footer>
          Page URL: <a href="https://fentelesgames.github.io/logico-privacy/">https://fentelesgames.github.io/logico-privacy/</a>
        </footer>
      </section>
    </main>
  </body>
</html>
